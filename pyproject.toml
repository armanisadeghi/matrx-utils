[project]
name = "matrx-utils"
version = "1.1.0"
description = "Shared utilities for the Matrx ecosystem"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Matrx", email = "admin@aimatrx.com" }
]
maintainers = [
    { name = "Matrx", email = "admin@aimatrx.com" }
]
keywords = [
    "utilities",
    "file-handling",
    "data-transformation",
    "matrx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.59",
    "boto3-stubs[s3]>=1.42.59",
    "dotenv>=0.9.9",
    "pymupdf>=1.27.0",
    "pypdfium2>=4.30.0",
    "httpx>=0.28.1",
    "pillow>=11.2.1",
    "pillow-avif-plugin>=1.4.6",
    "pillow-heif>=0.18.0",
    "mozjpeg-lossless-optimization>=1.1.0",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "pydantic>=2.0.0",
    "supabase>=2.28.0",
    "pandas>=3.0.1",
    # Image edit pipeline — backends for the image_ops dispatcher.
    # rembg + onnxruntime: foreground extraction (CPU is fine for u2net/u2netp).
    # opencv-python-headless + numpy: Telea / Navier-Stokes inpaint.
    # Both are required for the /images/bg-remove and /images/inpaint
    # endpoints to function without 503'ing. They're listed in the core
    # deps because every aidream deployment ships these endpoints.
    "rembg>=2.0",
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    # Video composition (compose_slideshow) — bundles a static ffmpeg build so
    # the slideshow/sizzle-reel engine works without a system ffmpeg on the box.
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Stage 2 PDF subsystem extras — install per capability instead of pulling
# heavy deps into every consumer. See packages/matrx-utils/matrx_utils/file_handling/
# specific_handlers/pdf/__init__.py for the layout these groups feed.
pdf-tables       = ["tabula-py>=2.9"]              # Stage 1 legacy backend (Java required)
pdf-tables-extra = ["camelot-py>=0.11"]            # Lattice/stream fallback for tricky bordered tables
pdf-ocr          = ["ocrmypdf>=16"]                # Searchable-PDF + PDF/A generation
pdf-forms        = ["PyPDFForm>=1.4"]              # AcroForm read/fill/flatten
pdf-signatures   = ["pyHanko>=0.20"]               # PAdES sign + verify
pdf-html         = ["weasyprint>=60"]              # HTML/CSS → PDF when CSS3 fidelity matters
pdf-generate     = ["reportlab>=4.0"]              # Programmatic PDF generation (PyMuPDF Story covers most)
pdf-ml-llm       = ["pymupdf4llm>=0.0.30"]         # Markdown export + RAG-friendly chunking
pdf-redact-ner   = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
pdf-cloud-ocr    = ["boto3", "azure-ai-documentintelligence", "google-cloud-documentai"]

# Image editing extras — kept as named extras for downstream consumers
# that don't need the full image-ops surface and want to skip these.
# Note: aidream pins both backends in its core deps (above), so a normal
# aidream server gets bg_remove + inpaint out of the box. These extras
# exist for matrx-utils consumers other than aidream.
image-segmentation = ["rembg>=2.0", "onnxruntime>=1.16"]  # rembg foreground extraction
image-inpaint      = ["opencv-python-headless>=4.9", "numpy>=1.26"]  # OpenCV Telea / NS inpaint

[project.urls]
Homepage = "https://github.com/AI-Matrix-Engine/aidream-current"
Repository = "https://github.com/AI-Matrix-Engine/aidream-current"
Issues = "https://github.com/AI-Matrix-Engine/aidream-current/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["matrx_utils"]
# Note: SQL files under matrx_utils/file_handling/cloud_sync/sql/ are
# auto-included via the ``packages = ["matrx_utils"]`` directive — they
# live INSIDE the package tree. A previous ``force-include`` block here
# was duplicating every SQL file in the wheel (2× entries per file with
# the same path), which surfaces as ``UserWarning: Duplicate name`` at
# build time and bloats the wheel. Don't add it back.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
